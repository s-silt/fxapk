# 取证运行环境锁：把**分析结果可复现**所依赖的整棵运行时闭包钉到确定版本。
#
# 为什么单独一份锁、而不是把版本写进 pyproject.toml：
#   pyproject 的 dependencies 是**安装约束**，钉死会连带卡住所有下游环境；这份锁是
#   **运行环境快照**，只约束"要复现某份报告时该装什么"。两者目的相反，不能合并。
#
# 为什么取证工具非要有它：报告的结论由解析结果决定，而解析结果随上游库变。androguard 的
# axml/dex 解析在版本间会变（仓内 axml_nsmap_shim 就是踩坑留下的），jinja2 换版会改渲染，
# typer 换版会改 CLI 行为。报告里的 meta.dependency_versions 记录的是"这次实际跑了什么"，
# 那是**事后溯源**；这份锁提供的是"下次还能跑成一样"的**事前保证**。两者都要有。
#
# 用法（复现某份报告的分析环境）：
#   python -m venv .venv-forensic
#   .venv-forensic/bin/pip install -r requirements.lock
#   .venv-forensic/bin/pip install --no-deps .
#   ★ --no-deps 不可省：省了 pip 会重新解析依赖，把锁住的版本又升上去。
#
# 重新生成（升级依赖时）：
#   python -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install '.[pcap,dynamic,ml]'
#   /tmp/lockenv/bin/pip freeze | grep -v '^fxapk' > requirements.lock   # 再补回本文件头
#   之后跑 tests/test_requirements_lock.py 确认锁与 pyproject 没脱节。
#
# 范围：**只锁运行时**。pytest / ruff / pyright 等开发工具不在内——它们不参与分析，
# 版本漂移不会改变任何一份报告的结论。
#
# 平台：除末尾带标记的一条外，其余在三大平台取值相同；同一份锁跨平台装出同一组版本。
#
# 生成于 2026-08-15，对应 fxapk 1.6.1 / Python 3.12。

