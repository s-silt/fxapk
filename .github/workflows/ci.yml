name: CI

# PR 是主门（master 受分支保护：required checks + strict up-to-date）；push 兜底
# admin 直推并让 README 的 CI 徽章反映 master 实际状态；workflow_dispatch 留手动入口。
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限。本工作流全部 job 只做 checkout + 跑检查，没有任何写操作
# （不发 PR 评论、不上传 SARIF、不推分支、不建 release），故顶层一刀切成只读即可；
# 将来某个 job 真需要写权限时，在**该 job 内**单独声明，不要放回顶层。
permissions:
  contents: read

# 同一 PR 的新推送取消旧的进行中/排队运行；分组键含 workflow + event + PR 号，不同 PR 互不影响。
# 非 PR 事件（push master / workflow_dispatch）用唯一 run_id 分组：共享分组即使不取消也会
# 让排队中的旧运行被新运行顶替，master 推送的每次 CI 都必须跑完。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive-codecs:
    name: archive codecs (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[review]" pytest
      - name: Verify Python 3.14 backports.zstd marker and codec backend
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import sys
          from fxapk.core import evidence_archive as ea

          backend = ea._zstd_backend().__name__
          if sys.version_info >= (3, 14):
              assert backend == "compression.zstd", f"expected stdlib compression.zstd, got {backend}"
              try:
                  md.distribution("backports.zstd")
              except md.PackageNotFoundError:
                  pass
              else:
                  raise AssertionError("backports.zstd must not be installed on Python >= 3.14")
          else:
              assert backend == "backports.zstd", f"expected backports.zstd, got {backend}"
              md.distribution("backports.zstd")
          print(f"Python {sys.version_info.major}.{sys.version_info.minor} archive codec marker OK: {backend}")
          PY
      - name: Verify backport and standard-library archive paths
        run: python -m pytest -q tests/test_evidence_archive.py tests/test_evidence_zstd.py

  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ★PII 硬防线：语料库/案件数据只能经 FXAPK_CORPUS 存在授权的仓库外目录，绝不入 git。真正的 PII 载荷是
      #   报告全文 reports/<sha>/<tv>_<digest>.report.json（含真实 IOC/案件线索），不止派生索引
      #   manifest.jsonl / ioc_index.jsonl——三者任一被跟踪即视为误提交、CI 红。
      - name: Guard — no corpus/case data committed
        run: |
          if git ls-files | grep -E '(^|/)(manifest\.jsonl|ioc_index\.jsonl)$|\.report\.json$'; then
            echo "::error::corpus/case data (*.report.json / manifest.jsonl / ioc_index.jsonl) must never be committed — keep it outside this repository via FXAPK_CORPUS"
            exit 1
          fi
          echo "no corpus data files tracked — OK"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            plugins/fxapk-flutter/pyproject.toml
      - name: Install deps + linters
        run: |
          python -m pip install -e ".[review]"
          python -m pip install -e "./plugins/fxapk-flutter"
          # Pinned: the lint gate must be deterministic — unpinned ruff lets a
          # release with changed defaults/rules silently alter what CI enforces.
          python -m pip install "ruff==0.15.15" pyright
      # 插件（含 Android UI）与 tools/ 同受 lint；Android UI 只依赖核心 + typer + 包内相对导入，
      # 无需安装即可类型检查。tools/ 只进 ruff：其类型检查未在 CI 环境验证过，不在此处宣称覆盖。
      - name: Ruff (lint)
        run: python -m ruff check fxapk tests tools plugins/fxapk-rea/src plugins/fxapk-asc/src plugins/fxapk-flutter/src plugins/fxapk-android-ui/src
      - name: Pyright (type check)
        run: python -m pyright fxapk plugins/fxapk-rea/src plugins/fxapk-asc/src plugins/fxapk-flutter/src plugins/fxapk-android-ui/src
      - name: Auto result type contract (required)
        run: python tests/check_auto_result_types.py

  leak-scan:
    # ★第二道防线：本地 pre-commit hook 可被 --no-verify 跳过，CI 不能。
    #   判据只施加在 PR 的**新增行**上——仓库既有正常文字与合成夹具数以千计，
    #   对全树施压会产生海量误报，误报多到一定程度人就会习惯性加豁免、护栏随之失效。
    name: leak scan (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # 需要 base 与 head 两侧历史才能算 diff；默认浅克隆只有一个 commit。
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        # Minimal verified leak-scan import closure: explicit typer + click (newer typer
        # may not pull click) + PyYAML (required for rule/allowlist loading), plus editable
        # core with --no-deps to skip heavyweight analysis dependencies.
        run: |
          python -m pip install typer click PyYAML
          python -m pip install --no-deps -e "."
      - name: Scan added lines for leaked literals (strict)
        run: |
          # 不加 --depth：`base...HEAD` 要算 merge-base，浅历史会让它失败（继而误红/误绿）。
          git fetch --no-tags origin "${{ github.base_ref }}"
          # --strict：新增行上连 domain / context 两条判据也阻断。这两条对**全树**噪音太大
          # （见下面 full-tree 关只压默认判据），但对"这个 PR 新写的行"完全可控：写的人当场
          # 就能改成 example.com / .test，或加带理由的行内豁免。少了 --strict，新域名字面与
          # 语境框架词只会打印一行"提示"然后 exit 0 —— 那两条判据在 CI 里等于不存在。
          python -m fxapk.cli leak-scan --base "origin/${{ github.base_ref }}" --strict

  leak-scan-full-tree:
    # ★第三道防线：diff 判据只看**新增行**，故合并前已存在的阻断项会被永久 grandfather。
    #   这一关对**全树**施压并要求恒为 0：清理过的树只要有人加回一条无豁免的公网字面
    #   （哪怕是改动既有行），这里就红。与上面的 diff 关是**互补**关系，不替代它：
    #   diff 关在 PR 上更严（strict 档连 domain/context 都拦），本关只压默认阻断判据。
    #   默认档现在含三条案件值判据（人名 / 联系方式 / 二开包名），它们全树实测误报可控，
    #   故与 ip/secret 同档——案件值一旦推上远端，改写历史也删不掉缓存副本。
    name: leak scan (full tree, must be 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        # Minimal verified leak-scan import closure: explicit typer + click (newer typer
        # may not pull click) + PyYAML (required for rule/allowlist loading), plus editable
        # core with --no-deps to skip heavyweight analysis dependencies.
        run: |
          python -m pip install typer click PyYAML
          python -m pip install --no-deps -e "."
      - name: Default blocking findings across tracked fxapk/ + tests/ + plugins/ + tools/ must be 0
        # --tracked：只扫 git 已跟踪文件。不加它会连 CI 上的未跟踪产物（安装期生成物、
        # 缓存解包内容）一起扫，门禁就会随运行环境漂移；枚举不到文件时 CLI exit 2，
        # 「少扫了」不会与「扫全了」同形。plugins/（含 Android UI）与 tools/ 同样随仓库公开。
        run: python -m fxapk.cli leak-scan --tracked --path fxapk --path tests --path plugins --path tools

  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 跑全 Python 版本；macOS / Windows 各跑一版验跨平台（路径/编码/换行等平台差异）。
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            plugins/fxapk-android-ui/pyproject.toml
            plugins/fxapk-rea/pyproject.toml
            plugins/fxapk-flutter/pyproject.toml
      - name: Install package + test deps
        # 单次 pip 调用（Windows 默认 pwsh 同样可解析这一行）：
        # - ".[review]"：Run actual synthetic recovery/emulation checks rather than optional-dependency skips.
        # - fxapk-android-ui：Install editable Android UI plugin so matrix tests exercise the real installed package and entry point.
        # - fxapk-rea[trace]：trace 传输测试在插件可选 extra 里，不进核心依赖。
        # - fxapk-flutter：Synthetic Flutter tests need pyelftools; no Docker image or case input in CI.
        # - build/setuptools/wheel：test_version_artifacts.py 的产物级测试要跑
        #   `python -m build --no-isolation`，三者缺一测试就地 skip。矩阵关必须
        #   显式装上让它们真跑——守门测试静默 skip 等于没有门（#363 红叉根因）。
        # - pytest-xdist：全量并行（-n auto；Linux 矩阵 --dist loadscope，macOS/Windows --dist worksteal），计费按 job 时长、并行直接省分钟。
        run: python -m pip install -e ".[review]" -e "./plugins/fxapk-android-ui" -e "./plugins/fxapk-rea[trace]" -e "./plugins/fxapk-flutter" pytest pytest-cov pytest-xdist build "setuptools>=68" wheel
      # 覆盖率门禁只在 Linux py3.12 跑（基线 83%，阈值 80 留 3% 余量），host + 隔离 + 并行三段
      # 全部汇入同一份 .coverage。Linux py3.11 跑完全相同的节点与排除项、各一次，但不插桩。
      # macOS/Windows 覆盖到的行不同（平台分支），共用一个阈值会假红；那两个 job 只验跨平台正确性。
      - name: Verify isolated descendant fixture controls (Linux 3.12)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -c "from coverage import CoverageData"
          python -m pytest -q -p no:cacheprovider tests/test_ci_descendant_fixture.py \
            --junitxml="$RUNNER_TEMP/fxapk-isolated-fixture-controls.xml"
          python - <<'PYTEST_CONTROLS'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "fxapk-isolated-fixture-controls.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 20 and len({case.get("name") for case in cases}) == 20 and all(
              case.get("classname") == "tests.test_ci_descendant_fixture" and len(case) == 0 for case in cases
          ), "isolated fixture control missing, duplicate, skipped or failed"
          PYTEST_CONTROLS
      - name: Run tests + coverage gate (Linux)
        if: runner.os == 'Linux'
        # FXAPK_REQUIRE_BUILD_TOOLCHAIN=1：产物级版本测试在矩阵关缺构建链时必须 fail
        # 而非 skip——否则上面的安装行被改掉后守门测试会静默消失、CI 照绿。
        env:
          FXAPK_REQUIRE_BUILD_TOOLCHAIN: "1"
          FXAPK_MATRIX_PYTHON: ${{ matrix.python-version }}
        run: |
          # 运行 46117018929（38e48ab）有三个 Linux job 在 xdist 下出现合成节点失败：Ubuntu py3.11、locked
          # （job 140893005383）与 Ubuntu py3.12（job 140893005333，test_real_unicorn_calls_and_negative_vectors），
          # worker 日志均为 POSIX ownership_scan / environ / AccessDenied。只是与 xdist 相关，未证实因果竞态；
          # 这四条节点在两个 Linux 单元都移入串行 host 阶段各跑一次（3.12 沿用 host 覆盖率），不跳过、不重试。
          # 并行阶段用 --dist loadscope：同一模块（类内测试按类）的节点留在同一 worker 顺序执行，减少同模块真
          # run_owned 节点的并发重叠；不同模块仍跨 worker 并发、照样扫描整张同 UID 进程表，不是全局隔离，单独不证明修复。
          serial_nodes=(
            "tests/test_recovery_pipeline.py::test_execution_budgets_and_missing_environment_fail_explicitly[010000d4-system_instruction_unsupported]"
            "tests/test_recovery_pipeline.py::test_execution_budgets_and_missing_environment_fail_explicitly[000040f9c0035fd6-emulation_fault]"
            "tests/test_recovery_pipeline.py::test_real_unicorn_calls_and_negative_vectors"
            "tests/test_evidence_archive.py::test_archive_apk_real_offline_pipeline_preserves_hash_and_reports_storage"
          )
          serial_deselect=()
          for node in "${serial_nodes[@]}"; do
            serial_deselect+=("--deselect=$node")
          done
          host_tests=(tests/test_proctree.py::test_linux_preexisting_nondumpable_process_does_not_break_owned_run "${serial_nodes[@]}")
          isolated=(--deselect=tests/test_proctree.py::test_descendants_after_root_exit_force_killed)
          host_coverage=()
          parallel_coverage=()
          if [ "$FXAPK_MATRIX_PYTHON" = "3.12" ]; then
            # Only Linux py3.12 instruments; the host .coverage is required by the isolated
            # descendant merge and the parallel stage appends to it before the 80% gate.
            host_coverage=(--cov=fxapk --cov-report= --cov-fail-under=0)
            parallel_coverage=(--cov=fxapk --cov-append --cov-report=term-missing:skip-covered --cov-fail-under=80)
          fi
          if [ "$FXAPK_MATRIX_PYTHON" != "3.12" ]; then
            # Do not overlap the live process-table fixture with another pytest worker.
            host_tests+=(tests/test_proctree.py::test_descendants_after_root_exit_force_killed)
          fi
          python -m pytest -q -n 0 "${host_tests[@]}" \
            "${host_coverage[@]}" \
            --junitxml=${{ runner.temp }}/fxapk-host-test.xml
          python - <<'PYTEST_XML'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "fxapk-host-test.xml").getroot()
          base = "test_execution_budgets_and_missing_environment_fail_explicitly"
          expected = [
              ("tests.test_proctree", "test_linux_preexisting_nondumpable_process_does_not_break_owned_run"),
              ("tests.test_recovery_pipeline", f"{base}[010000d4-system_instruction_unsupported]"),
              ("tests.test_recovery_pipeline", f"{base}[000040f9c0035fd6-emulation_fault]"),
              ("tests.test_recovery_pipeline", "test_real_unicorn_calls_and_negative_vectors"),
              ("tests.test_evidence_archive", "test_archive_apk_real_offline_pipeline_preserves_hash_and_reports_storage"),
          ]
          if os.environ["FXAPK_MATRIX_PYTHON"] != "3.12":
              expected.append(("tests.test_proctree", "test_descendants_after_root_exit_force_killed"))
          cases = list(root.iter("testcase"))
          assert sorted((case.get("classname", ""), case.get("name", "")) for case in cases) == sorted(expected) and all(
              len(case) == 0 for case in cases
          ), "host fixture missing, duplicate, skipped or failed"
          PYTEST_XML
          if [ "$FXAPK_MATRIX_PYTHON" = "3.12" ]; then
            # This test's native process-table checks require a private process namespace.
            # Only exclude it from xdist after the required isolated JUnit and coverage receipt.
            python -IB tools/ci_descendant_fixture.py "$GITHUB_SHA"
            isolated+=(--ignore=tests/test_ci_descendant_fixture.py)
          fi
          python -m pytest -q -n auto --dist loadscope \
            --deselect=tests/test_proctree.py::test_linux_preexisting_nondumpable_process_does_not_break_owned_run \
            "${serial_deselect[@]}" \
            "${isolated[@]}" \
            "${parallel_coverage[@]}" \
            --junitxml=${{ runner.temp }}/fxapk-tests.xml
      - name: Verify Linux process ownership tests actually ran
        if: runner.os == 'Linux'
        env:
          FXAPK_MATRIX_PYTHON: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          roots = [ET.parse(Path(os.environ["RUNNER_TEMP"]) / name).getroot() for name in ("fxapk-host-test.xml", "fxapk-tests.xml")]
          for name in ("test_linux_preexisting_nondumpable_process_does_not_break_owned_run", "test_outer_timeout_kills_nested_owned_session_but_not_unrelated_process"):
              cases = [case for root in roots for case in root.iter("testcase") if case.get("name") == name]
              assert len(cases) == 1 and len(cases[0]) == 0, f"critical test missing, skipped or failed: {name}"
              print(f"PASSED: {name}")
          descendant = "test_descendants_after_root_exit_force_killed"
          host, parallel = [
              [case for case in root.iter("testcase") if case.get("classname") == "tests.test_proctree"
               and case.get("name") == descendant] for root in roots
          ]
          assert not parallel, "serial or isolated fixture also appeared in parallel JUnit"
          if os.environ["FXAPK_MATRIX_PYTHON"] != "3.12":
              assert len(host) == 1 and len(host[0]) == 0, f"serial fixture did not pass: {descendant}"
          else:
              assert not host, "isolated fixture also appeared in serial host JUnit"
          parallel_root = roots[1]
          base = "test_execution_budgets_and_missing_environment_fail_explicitly"
          # 串行节点在 host JUnit 中恰好一次、classname 精确、未 skip/失败，已由上一步 host 断言（精确集合相等）
          # 保证且该步失败即不会到这里；此处只需证明它们没有在并行阶段重复执行。
          serial_nodes = [
              ("tests.test_recovery_pipeline", f"{base}[010000d4-system_instruction_unsupported]"),
              ("tests.test_recovery_pipeline", f"{base}[000040f9c0035fd6-emulation_fault]"),
              ("tests.test_recovery_pipeline", "test_real_unicorn_calls_and_negative_vectors"),
              ("tests.test_evidence_archive", "test_archive_apk_real_offline_pipeline_preserves_hash_and_reports_storage"),
          ]
          for classname, name in serial_nodes:
              assert not [case for case in parallel_root.iter("testcase") if case.get("name") == name], (
                  f"serial node also ran in parallel: {classname}::{name}"
              )
              print(f"PASSED serially once: {classname}::{name}")
          # 同一参数化的其余节点仍留在并行阶段、恰好一次。
          others = [case for case in parallel_root.iter("testcase") if case.get("classname") == "tests.test_recovery_pipeline"
                    and case.get("name", "").startswith(base + "[")]
          assert [case.get("name") for case in others] == [f"{base}[00000014-emulation_budget_exhausted]"], others
          PY
      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        env:
          FXAPK_REQUIRE_BUILD_TOOLCHAIN: "1"
        run: python -m pytest -q -n auto --dist worksteal
      # ★合成基线不可变守卫：CI 运行期间 tests/synthetic（快照基线 + 检出基线 + 夹具）被任何
      #   步骤改写即红。测试进程内的 env 自检（test_baseline_update_env_var_not_set）只看得见
      #   pytest 自己的环境——"某步骤先设 APKSCAN_ALLOW_BASELINE_UPDATE=1 跑更新器、unset 后
      #   再跑 pytest"它是盲的，基线已被重写而漂移测试照绿。这一步看的是文件本身：基线更新
      #   只能发生在 PR diff 里、被人 review，不得发生在 CI 运行时。
      - name: Guard — synthetic baselines untouched during CI
        run: git diff --exit-code -- tests/synthetic

  jadx-recall-replay:
    # ★召回基线出处的端到端重放：从 origin 历史取 master 基线 commit（bd58041，
    #   全 SHA 钉在 tests/gen_jadx_recall_baseline.py 的 MASTER_COMMIT，workflow 不
    #   另存一份）的 fxapk 树，在该树的提取器下实测 tests/jadx_recall_corpus.py
    #   语料，与 tests/jadx_recall_master_baseline.py 钉住的基线字面量逐项对账
    #   （纯数据模块——本 job 只装运行期依赖，裁决链不得连带 pytest）。防的是
    #   「MASTER_EXTRACTION/MASTER_PATHS 来自 master 实测」这句宣称烂掉：改语料、
    #   改基线字面量、换基线 commit 而没有真重放对齐，这里当场红——重放不再依赖
    #   执行者的命令行纪律。保证边界（如实）：commit SHA 内容寻址使「对账的树就是
    #   那个 commit」机器可证；「该 commit 是否该当基线」仍是 review 裁决。
    name: jadx recall baseline replay (master)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 重放要 git archive 历史基线 commit；浅克隆没有那个树。全历史 size-pack
          # 仅 ~4MiB，代价可忽略（leak-scan 关已同样全量拉取）。
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e "."
      - name: Replay master extractor over pinned corpus and verify baseline literals
        run: python tests/gen_jadx_recall_baseline.py replay

  locked-env:
    # ★取证复现关：上面的矩阵装的是**当下最新**的依赖，验的是"跟着上游走还没坏"；
    #   这一关装 requirements.lock 钉死的那组，验的是"照锁装出来的环境仍能跑出结果"。
    #   两关是互补的：只有前者，锁会悄悄烂掉（没人装过，装不起来也没人知道）；
    #   只有后者，上游破坏性变更要等到下次升级才暴露。
    name: pytest (locked forensic env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
            plugins/fxapk-rea/pyproject.toml
      - name: Install from lock
        run: |
          python -m pip install -r requirements.lock
          # --no-deps：不加会让 pip 重新解析依赖，把刚锁住的版本又升上去，这一关就白跑了。
          python -m pip install --no-deps .
          # fxapk-rea 的运行时依赖只有 core+typer（都在锁内），websockets 是可选 trace 附加项，不装。
          python -m pip install --no-deps -e ./plugins/fxapk-rea
          # 有意不装 build/setuptools/wheel：锁环境对齐真实取证部署、不混构建工具链，
          # test_version_artifacts 的产物级测试在本关按 skip 通过（矩阵关 + package-smoke 已覆盖）。
          # pytest/pytest-xdist 是锁外的测试工具，不属于取证运行时依赖。
          python -m pip install pytest pytest-xdist
      - name: Assert the installed versions match the lock
        # 装完再核一遍：锁写了什么与实际装成什么之间，只有这一步能证明没有偏差。
        run: |
          python - <<'PY'
          import re, subprocess, sys
          pin = re.compile(r"^([A-Za-z0-9._-]+)==([^\s;]+)")
          norm = lambda s: re.sub(r"[-_.]+", "-", s).lower()
          want = {}
          for line in open("requirements.lock", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if 'sys_platform == "win32"' in line:
                  continue  # 本关跑在 Linux 上，Windows-only 项按标记跳过
              m = pin.match(line)
              want[norm(m.group(1))] = m.group(2)
          got = {}
          for line in subprocess.run([sys.executable, "-m", "pip", "freeze"],
                                     capture_output=True, text=True, check=True).stdout.splitlines():
              m = pin.match(line.strip())
              if m:
                  got[norm(m.group(1))] = m.group(2)
          bad = {k: (v, got.get(k)) for k, v in want.items() if got.get(k) != v}
          if bad:
              print("锁与实际安装版本不一致（包: 锁 / 实际）:")
              for k, (w, g) in sorted(bad.items()):
                  print(f"  {k}: {w} / {g}")
              sys.exit(1)
          print(f"锁住的 {len(want)} 个包全部按版本装到位。")
          PY
      - name: Run tests in the locked environment
        run: |
          python -m pytest -q -n 0 tests/test_proctree.py::test_linux_preexisting_nondumpable_process_does_not_break_owned_run \
            --junitxml=${{ runner.temp }}/fxapk-host-test.xml
          python - <<'PYTEST_XML'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "fxapk-host-test.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 1 and cases[0].get("name") == "test_linux_preexisting_nondumpable_process_does_not_break_owned_run" and len(cases[0]) == 0, "host fixture missing, skipped or failed"
          PYTEST_XML
          # CI #601（参考运行 46016142976 / job 140563645981）在本关 -n auto 下失败的两条合成恢复
          # 节点、运行 46117018929 本关（job 140893005383）失败的合成证据归档节点，以及同一运行
          # Ubuntu py3.12（job 140893005333）失败的 test_real_unicorn_calls_and_negative_vectors：移出并行阶段，
          # 在独立临时目录里各串行执行一次。同一运行共三个 Linux job 失败；并行进程干扰只是假设，未证实为因果竞态；
          # 这里不跳过、不重试、不放宽断言，失败照样红。
          recovery_nodes=(
            "tests/test_recovery_pipeline.py::test_execution_budgets_and_missing_environment_fail_explicitly[010000d4-system_instruction_unsupported]"
            "tests/test_recovery_pipeline.py::test_execution_budgets_and_missing_environment_fail_explicitly[000040f9c0035fd6-emulation_fault]"
            "tests/test_recovery_pipeline.py::test_real_unicorn_calls_and_negative_vectors"
            "tests/test_evidence_archive.py::test_archive_apk_real_offline_pipeline_preserves_hash_and_reports_storage"
          )
          recovery_deselect=()
          for node in "${recovery_nodes[@]}"; do
            recovery_deselect+=("--deselect=$node")
          done
          scratch=$(mktemp -d "$RUNNER_TEMP/fxapk-locked-recovery.XXXXXX")
          mkdir "$scratch/tmp"
          TMPDIR="$scratch/tmp" python -m pytest -q -n 0 "${recovery_nodes[@]}" \
            --basetemp="$scratch/basetemp" -o cache_dir="$scratch/cache" \
            --junitxml=${{ runner.temp }}/fxapk-locked-recovery.xml
          rm -rf -- "$scratch"
          python -m pytest -q -n auto --dist worksteal \
            --deselect=tests/test_proctree.py::test_linux_preexisting_nondumpable_process_does_not_break_owned_run \
            "${recovery_deselect[@]}" \
            --junitxml=${{ runner.temp }}/fxapk-locked-tests.xml
      - name: Verify locked serial nodes ran exactly once, serially
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          serial = list(ET.parse(temp / "fxapk-locked-recovery.xml").getroot().iter("testcase"))
          parallel = list(ET.parse(temp / "fxapk-locked-tests.xml").getroot().iter("testcase"))
          base = "test_execution_budgets_and_missing_environment_fail_explicitly"
          expected = [
              ("tests.test_recovery_pipeline", f"{base}[010000d4-system_instruction_unsupported]"),
              ("tests.test_recovery_pipeline", f"{base}[000040f9c0035fd6-emulation_fault]"),
              ("tests.test_recovery_pipeline", "test_real_unicorn_calls_and_negative_vectors"),
              ("tests.test_evidence_archive", "test_archive_apk_real_offline_pipeline_preserves_hash_and_reports_storage"),
          ]
          assert sorted((case.get("classname", ""), case.get("name", "")) for case in serial) == sorted(expected) and all(
              len(case) == 0 for case in serial
          ), "serial node missing, duplicate, skipped or failed"
          expected_names = {name for _, name in expected}
          assert not [case for case in parallel if case.get("name") in expected_names], "serial node also ran in parallel"
          # 同一参数化的其余节点仍留在并行阶段、恰好一次。
          others = [case for case in parallel if case.get("classname") == "tests.test_recovery_pipeline"
                    and case.get("name", "").startswith(base + "[")]
          assert [case.get("name") for case in others] == [f"{base}[00000014-emulation_budget_exhausted]"], others
          print("PASSED: locked serial nodes serial, isolated, once")
          PY
      # 同 test job 的基线不可变守卫（这个 job 也跑全量 pytest，同样的绕闸面）。
      - name: Guard — synthetic baselines untouched during CI
        run: git diff --exit-code -- tests/synthetic

  asc-live:
    # ★矩阵关不装 fxapk-asc，ASC 真跑测试在那里恒 skip。身份表对账只比字面量：
    #   核心、worker 与测试清单一起写错新版 findrefs hash 时它照绿，装上真发布物后
    #   dex query 却返回 provider_version_mismatch。这一关按锁装真发布物去对账。
    #   FXAPK_REQUIRE_ASC_LIVE=1 把缺件从 skip 改成 fail：本环境声明必须真跑，
    #   缺件是 CI 配置错误，不许静默 skip。
    name: "pytest (ASC provider, locked)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            plugins/fxapk-asc/requirements.lock
            plugins/fxapk-asc/pyproject.toml
      - name: Install core and locked ASC provider
        run: |
          python -m pip install -e "." pytest
          # 只绕开固定官方 wheel 的索引查找；摘要仍只从 _ASC_RELEASES 取。
          python - <<'PYREQ'
          import os
          from pathlib import Path
          from fxapk.core import dex_query as dq
          from tests.test_dex_query_versions import _ASC_RELEASES
          temp = Path(os.environ["RUNNER_TEMP"])
          release = _ASC_RELEASES[dq.PINNED_VERSION]
          digest = release["wheel_sha256"]
          (temp / "droidasc-url.req").write_text(
              f"droidasc @ {release['wheel_url']} --hash=sha256:{digest}\n", encoding="utf-8"
          )
          (temp / "droidasc.req").write_text(
              f"droidasc=={dq.PINNED_VERSION} --hash=sha256:{digest}\n", encoding="utf-8"
          )
          PYREQ
          WHEELS=$(mktemp -d "$RUNNER_TEMP/droidasc-wheel.XXXXXX")
          python -m pip --disable-pip-version-check download --no-index --no-deps --only-binary=:all: --require-hashes --timeout 30 --retries 1 -r "$RUNNER_TEMP/droidasc-url.req" --dest "$WHEELS"
          # 按版本从只含已验证 wheel 的目录安装，保留 pip freeze 的锁校验语义。
          python -m pip install --no-index --find-links "$WHEELS" --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/droidasc.req"
          # 其余直接依赖按锁装；axml/mutf8 无 hash 钉，mutf8 由 worker 运行期自检编码。
          python -m pip install -r plugins/fxapk-asc/requirements.lock
          # --no-deps：防止重新解析依赖把锁住的版本升上去。
          python -m pip install --no-deps -e ./plugins/fxapk-asc
      - name: Assert the installed versions match the ASC lock
        run: |
          python - <<'PY'
          import re, subprocess, sys
          pin = re.compile(r"^([A-Za-z0-9._-]+)==([^\s;]+)")
          norm = lambda s: re.sub(r"[-_.]+", "-", s).lower()
          want = {}
          for line in open("plugins/fxapk-asc/requirements.lock", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              m = pin.match(line)
              want[norm(m.group(1))] = m.group(2)
          got = {}
          for line in subprocess.run([sys.executable, "-m", "pip", "freeze"],
                                     capture_output=True, text=True, check=True).stdout.splitlines():
              m = pin.match(line.strip())
              if m:
                  got[norm(m.group(1))] = m.group(2)
          bad = {k: (v, got.get(k)) for k, v in want.items() if got.get(k) != v}
          if bad:
              print("锁与实际安装版本不一致（包: 锁 / 实际）:")
              for k, (w, g) in sorted(bad.items()):
                  print(f"  {k}: {w} / {g}")
              sys.exit(1)
          print(f"锁住的 {len(want)} 个包全部按版本装到位。")
          PY
      - name: Run ASC live tests
        env:
          FXAPK_REQUIRE_ASC_LIVE: "1"
        run: python -m pytest -q -rs tests/test_asc_live.py tests/test_dex_query_versions.py

  package-smoke:
    name: package smoke (wheel install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            plugins/fxapk-android-ui/pyproject.toml
            plugins/fxapk-flutter/pyproject.toml
            plugins/fxapk-rea/pyproject.toml
      - name: Build wheels
        run: |
          python -m pip install build
          python -m build --wheel
          python -m build --wheel plugins/fxapk-android-ui --outdir plugin-dist
          python -m build --wheel plugins/fxapk-flutter --outdir plugin-dist
          python -m build --wheel plugins/fxapk-rea --outdir plugin-dist
      - name: Install built wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          # 入口 console_script 装包后可用。
          /tmp/smoke/bin/fxapk --version
          # ★关键：rules/*.yaml 等 package-data 真打进 wheel 且可被 importlib.resources 读到。
          #   纯源码测试跑不出这类“忘打数据文件 → pip 装完加载不了规则”的发布事故。
          /tmp/smoke/bin/python -I -c "import sys, fxapk; from pathlib import Path; from importlib.resources import files; from fxapk.core.registry import load_rules; assert Path(fxapk.__file__).is_relative_to(Path(sys.prefix)), 'checkout shadowed installed wheel'; assert all(load_rules(n) for n in ('packers','re_toolkit','app_types','source_access')), 'packaged rules missing from wheel'; assert list(files('fxapk.dynamic').joinpath('frida_js').iterdir()), 'packaged hooks missing'; assert list(files('fxapk').joinpath('report/templates').iterdir()), 'packaged templates missing'; print('installed wheel resources OK')"
          # 与发版门禁同一路径：离线分析 → digest → 证据打包/校验 → 损坏副本必须非零。
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          /tmp/smoke/bin/python -I tools/release_smoke.py --expect-version "$VERSION"
      # ★插件注册契约：用刚构建的**同一批** wheel 文件，分别装进两个全新 venv。core 环境只装核心，
      #   必须零插件入口；registered 环境装核心 + Android UI + Flutter + REA，入口与归属必须逐条精确。
      #   ASC 没有插件入口，仍由上面 asc-live 的锁定运行时单独验证，不混进这里。
      - name: Plugin registration smoke on the exact built wheels
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          one() {
            local matches=($1)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "::error::expected exactly one wheel matching $1" >&2
              return 1
            fi
            realpath -- "${matches[0]}"
          }
          core=$(one 'dist/fxapk-*.whl')
          ui=$(one 'plugin-dist/fxapk_android_ui-*.whl')
          flutter=$(one 'plugin-dist/fxapk_flutter-*.whl')
          rea=$(one 'plugin-dist/fxapk_rea-*.whl')
          script="$GITHUB_WORKSPACE/tools/release_plugin_smoke.py"
          for mode in core registered; do
            env_dir=$(mktemp -d "$RUNNER_TEMP/fxapk-plugin-smoke-$mode.XXXXXX")
            python -m venv "$env_dir/venv"
            if [ "$mode" = core ]; then wheels=("$core"); else wheels=("$core" "$ui" "$flutter" "$rea"); fi
            "$env_dir/venv/bin/python" -m pip install --disable-pip-version-check "${wheels[@]}"
            (cd "$env_dir" && "$env_dir/venv/bin/python" -I "$script" --expect-version "$VERSION" "$mode")
          done

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # 审计**仅 fxapk 的依赖树**：把 fxapk 装进隔离 venv，不含 pip-audit 自身及其
      # 依赖 / CI 工具——否则那些无关上游漏洞会让审计误红（pip-audit 的传递依赖爆 CVE 与本项目无关）。
      - name: Install fxapk deps into an isolated venv
        run: |
          python -m venv /tmp/auditenv
          /tmp/auditenv/bin/python -m pip install --upgrade pip
          /tmp/auditenv/bin/python -m pip install "."
      # pip-audit 装在 runner python（与被审 venv 隔离），--path 只审那个 venv 的 site-packages。
      # 当前干净 → 阻断式门禁，只在**新**漏洞出现时变红；某上游漏洞暂无修复版时用 `--ignore-vuln <ID>`
      # 显式豁免。不加 --strict：非 PyPI 的本地 fxapk 包会被跳过、--strict 会因此误红。
      - name: Audit only the fxapk dependency tree
        run: |
          python -m pip install "pip-audit==2.10.1"
          # sysconfig purelib = 真正的 site-packages（跨平台可靠；site.getsitepackages()[0] 在不同
          # 平台可能是 venv 根，会让 --path 审到空目录、"无漏洞"假绿）。
          SITE=$(/tmp/auditenv/bin/python -c "import sysconfig; print(sysconfig.get_path('purelib'))")
          echo "auditing: $SITE"
          test -d "$SITE" || { echo "site-packages 路径无效：$SITE"; exit 1; }
          python tools/audit_retry.py "$SITE"

  fixed-jadx-snapshot:
    name: fixed JADX report snapshot (19 cases)
    # Same-repository PR merge previews and protected master pushes only.
    # A skipped job is not evidence that this snapshot gate ran.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.ref_protected && !github.event.deleted) ||
      (github.event_name == 'pull_request' && github.base_ref == 'master' &&
      github.event.pull_request.head.repo['id'] &&
      github.event.pull_request.head.repo['id'] == github.event.repository['id'])
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Only install test dependencies: the isolated worker imports the staged
      # project snapshot directly and deliberately does not load editable .pth mappings.
      - name: Install fixed snapshot test dependencies
        run: python -m pip install -r requirements.lock pytest
      - name: Verify the checked-out snapshot and v3 receipt
        id: fixed-jadx-receipt
        shell: bash
        run: |
          if ! head="$(git rev-parse --verify HEAD 2>/dev/null)" ||
             ! tree="$(git rev-parse --verify 'HEAD^{tree}' 2>/dev/null)"; then
            echo 'fixed JADX: initial checkout verification failed' >&2
            exit 1
          fi
          check_checkout() {
            test "$(git rev-parse --verify HEAD)" = "$head" &&
              test "$(git write-tree)" = "$tree" &&
              git diff --quiet
          } 2>/dev/null
          if [ "$head" != "$GITHUB_SHA" ] || ! check_checkout; then
            echo 'fixed JADX: initial checkout verification failed' >&2
            exit 1
          fi
          scratch="$(mktemp -d "${RUNNER_TEMP:?}/fxapk-jadx-snapshot.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          receipt="$scratch/receipt.json"
          if sh .githooks/pre-commit --fixed-jadx --scratch "$scratch" >"$receipt" 2>/dev/null; then
            :
          else
            code=$?
            echo "fixed JADX: outer gate failed (exit $code)" >&2
            exit "$code"
          fi
          if ! check_checkout; then
            echo 'fixed JADX: final checkout verification failed' >&2
            exit 1
          fi
          python -m tools.verify_fixed_jadx_ci "$receipt" "$head" "$tree"
