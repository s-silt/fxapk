# One-use experiment. Only its explicitly named non-default branch can run it.
name: Two-stage release evidence rehearsal
on:
  push:
    branches: [experiment-two-stage-rehearsal-8dd8474]
    paths: ['.github/workflows/two-stage-release-rehearsal.yml']

env:
  VERSION: '2.0.4'

permissions: {}
jobs:
  build:
    if: github.event_name == 'push' && github.repository == 's-silt/fxapk' && github.ref == 'refs/heads/experiment-two-stage-rehearsal-8dd8474'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      id: ${{ steps.store.outputs.artifact-id }}
      digest: ${{ steps.store.outputs.artifact-digest }}
      context: ${{ steps.receipt.outputs.context }}
      inventory: ${{ steps.receipt.outputs.inventory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Build once, verify exact core wheel and all release assets
        shell: bash
        run: |
          python -m pip install build
          python -m build
          for plugin in fxapk-android-ui fxapk-rea fxapk-asc fxapk-flutter; do
            python -m build "plugins/$plugin" --outdir plugin-dist
          done
          python -m venv "$RUNNER_TEMP/fxapk-smoke"
          "$RUNNER_TEMP/fxapk-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/fxapk-smoke/bin/python" -I tools/release_smoke.py --expect-version "$VERSION"
          mkdir release-assets
          cp dist/*.whl dist/*.tar.gz plugin-dist/*.whl plugin-dist/*.tar.gz release-assets/
          (cd release-assets; sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          python tools/release_preflight.py --tag "v$VERSION" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Freeze accepted identity and all inner hashes
        id: receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          keys=("GITHUB_REPOSITORY_ID","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","GITHUB_SHA","VERSION")
          context={k:os.environ[k] for k in keys}
          assets=sorted(Path("release-assets").iterdir())
          assert len(assets)==11 and all(p.is_file() and not p.is_symlink() for p in assets)
          digests={}
          for path in assets:
              with path.open("rb") as f:
                  digests[path.name]=hashlib.file_digest(f,"sha256").hexdigest()
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("context="+json.dumps(context,separators=(",",":"))+"\n")
              f.write("inventory="+json.dumps(digests,separators=(",",":"))+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: store
        with:
          name: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  receive:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
    steps:
      - name: Match independent receiver context before any download
        env:
          PRODUCER_CONTEXT: ${{ needs.build.outputs.context }}
          ARTIFACT_ID: ${{ needs.build.outputs.id }}
          OUTER_SHA: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          keys=("GITHUB_REPOSITORY_ID","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","GITHUB_SHA","VERSION")
          assert json.loads(os.environ["PRODUCER_CONTEXT"])=={k:os.environ[k] for k in keys}
          assert re.fullmatch(r"[1-9][0-9]{0,18}",os.environ["ARTIFACT_ID"])
          assert re.fullmatch(r"[a-f0-9]{64}",os.environ["OUTER_SHA"])
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.id }}
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/fxapk-rehearsal-received
      - name: Offline-only receiver verification and inventory comparison
        env:
          ACCEPTED_INVENTORY: ${{ needs.build.outputs.inventory }}
          OUTER_SHA: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, stat, zipfile
          from pathlib import Path
          target=Path(os.environ["RUNNER_TEMP"])/"fxapk-rehearsal-received"
          paths=list(target.iterdir())
          assert len(paths)==1 and paths[0].is_file() and not paths[0].is_symlink()
          path=paths[0]
          assert 0 < path.stat().st_size <= 64*1024*1024
          with path.open("rb") as stream:
              assert hashlib.file_digest(stream,"sha256").hexdigest()==os.environ["OUTER_SHA"]
          expected=json.loads(os.environ["ACCEPTED_INVENTORY"])
          assert type(expected) is dict and len(expected)==11 and "SHA256SUMS.txt" in expected
          assert all(re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,199}",n) and
                     re.fullmatch(r"[a-f0-9]{64}",h) for n,h in expected.items())
          with zipfile.ZipFile(path) as zip_file:
              entries=zip_file.infolist()
              assert len(entries)==11 and {e.filename for e in entries}==set(expected)
              assert sum(e.file_size for e in entries)<=64*1024*1024
              for e in entries:
                  assert not e.is_dir() and not e.flag_bits&1
                  assert stat.S_IFMT(e.external_attr>>16) in (0,stat.S_IFREG)
                  assert e.compress_type in (zipfile.ZIP_STORED,zipfile.ZIP_DEFLATED)
                  with zip_file.open(e) as stream:
                      assert hashlib.file_digest(stream,"sha256").hexdigest()==expected[e.filename]
          print("Rehearsal only: all 11 received entries match the independently supplied producer inventory")
          PY
