name: Release evidence rehearsal

# No release events or publishing permissions. Only builds and moves an Actions artifact.
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/release-evidence-check.yml'
      - '.github/workflows/release.yml'
      - '.github/release-notes-template.md'
      - 'tools/release_preflight.py'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'plugins/fxapk-android-ui/pyproject.toml'
      - 'plugins/fxapk-rea/pyproject.toml'
      - 'plugins/fxapk-asc/pyproject.toml'
      - 'plugins/fxapk-flutter/pyproject.toml'
      - 'MANIFEST.in'  # leak-scan: allow tracked sdist manifest filename, not a domain.
      - 'plugins/fxapk-android-ui/MANIFEST.in'  # leak-scan: allow tracked sdist manifest filename, not a domain.
      - 'plugins/fxapk-asc/MANIFEST.in'  # leak-scan: allow tracked sdist manifest filename, not a domain.
      - 'plugins/fxapk-flutter/MANIFEST.in'  # leak-scan: allow tracked sdist manifest filename, not a domain.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-roundtrip:
    name: Build and upload manifest (no publish)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.preflight.outputs.artifact-name }}
      manifest-sha256: ${{ steps.preflight.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and verify disposable release inputs
        id: preflight
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          from tools.release_preflight import PROJECTS

          for project in PROJECTS[1:]:
              subprocess.run(
                  [sys.executable, "-m", "build", str(Path(project).parent), "--outdir", "plugin-dist"],
                  check=True,
              )
          PY
          mkdir release-assets
          cp dist/*.whl dist/*.tar.gz plugin-dist/*.whl plugin-dist/*.tar.gz release-assets/
          (cd release-assets && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          commit=$(git rev-parse --verify HEAD^{commit})
          tag=$(python -c 'import tomllib; from pathlib import Path; print("v" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          python tools/release_preflight.py --tag "$tag" --repository "$GITHUB_REPOSITORY" \
            --commit "$commit" --build-manifest release-build-manifest.json
          sha256sum release-build-manifest.json
          digest=$(sha256sum release-build-manifest.json | cut -d ' ' -f 1)
          printf 'manifest-sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'artifact-name=rehearsal-release-build-manifest-%s-%s-%s\n' \
            "$commit" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload rehearsal manifest only
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.preflight.outputs.artifact-name }}
          path: release-build-manifest.json
          if-no-files-found: error

  manifest-readback:
    name: Read back manifest with gh (no publish)
    needs: manifest-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download the retained manifest and check its original digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.manifest-roundtrip.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.manifest-roundtrip.outputs.artifact-name }}
          MANIFEST_SHA256: ${{ needs.manifest-roundtrip.outputs.manifest-sha256 }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ && -n "$ARTIFACT_NAME" ]]
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            destination=$(mktemp -d "$RUNNER_TEMP/fxapk-manifest.XXXXXX")
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "$ARTIFACT_NAME" --dir "$destination"; then
              actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
                --jq '[.name, (.workflow_run.id | tostring)] | @tsv')
              [[ "$actual" == "$ARTIFACT_NAME"$'\t'"$GITHUB_RUN_ID" ]]
              printf '%s  %s\n' "$MANIFEST_SHA256" "$destination/release-build-manifest.json" |
                sha256sum --check --strict
              printf 'artifact_id=%s manifest_sha256=%s\n' "$ARTIFACT_ID" "$MANIFEST_SHA256"
              exit 0
            fi
          done
          echo "::error::Rehearsal artifact did not become downloadable within the bounded retry window."
          exit 1
