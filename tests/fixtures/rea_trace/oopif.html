<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>oopif</title>
<style>html,body{margin:0;padding:0}#load{position:fixed;left:24px;top:24px;width:120px;height:40px;margin:0;padding:0;border:0}</style>
</head><body>
<button id="load" type="button">load</button>
<iframe id="child" title="child"></iframe>
<script>
var childOrigin = location.hostname === "localhost"
  ? "http://127.0.0.1:" + location.port
  : "http://localhost:" + location.port;
var frame = document.getElementById("child");
frame.src = childOrigin + "/oopif-child.html";
window.addEventListener("message", function (ev) {
  if (ev.origin !== childOrigin) {
    return;
  }
  if (!ev.data || ev.data.type !== "fxapk-ready") {
    return;
  }
  document.documentElement.setAttribute("data-fixture-ready", "1");
});
function loadConfig() {
  frame.contentWindow.postMessage({type: "fxapk-load"}, childOrigin);
}
document.getElementById("load").addEventListener("click", function () {
  loadConfig();
});
</script>
</body></html>
