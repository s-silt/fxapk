<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>crossframe</title>
<style>html,body{margin:0;padding:0}#load{position:fixed;left:24px;top:24px;width:120px;height:40px;margin:0;padding:0;border:0}</style>
</head><body>
<button id="load" type="button">load</button>
<iframe id="child" src="/cross-child.html" title="child"></iframe>
<script>
function loadConfig() {
  var child = document.getElementById("child").contentWindow;
  return child.scheduleFromParent();
}
document.getElementById("load").addEventListener("click", function () {
  loadConfig();
});
</script>
</body></html>
