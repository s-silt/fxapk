# 技术栈 / 后台框架指纹规则（人工复核候选）。
#
# ★ 定位与边界（务必守住）：本库只生成弱候选，不是主体归因或攻击工具。
#   - 只描述「哪种第三方 banner 记录 = 什么技术栈 / 后台框架」；相同框架不能证明同一后端或主体。
#   - **只识别、不研判漏洞、不给利用方向**；绝不含 exploit / PoC / 利用代码 / 注入串 / webshell / 具体命令。
#
# 指纹字段（对齐被动 enrichers 真实输出，小写子串匹配，任一命中即该条命中）：
#   server / x_powered_by / title  ← 服务 banner 的 Server / X-Powered-By / <title>
#   cookie                         ← Set-Cookie 名（离散 token，精确匹配）
#   product / cpe / module         ← shodan.services[]（第三方既有记录，可能过期）

# -------------------------------------------------------------------------
# 技术栈 / 后台框架指纹（仅识别 → 弱候选；不含漏洞方向、不含利用靶单）
# -------------------------------------------------------------------------
tech_stack:
  - name: "PHP"
    server: ["php"]
    x_powered_by: ["php"]
    cookie: ["phpsessid"]
    product: ["php"]
    cpe: ["cpe:/a:php:php", "cpe:2.3:a:php:php"]
    note: "PHP 语言栈；相同语言栈较常见，仅作弱候选，须由独立锚点复核"

  - name: "ThinkPHP"
    server: ["thinkphp"]
    x_powered_by: ["thinkphp"]
    product: ["thinkphp"]
    title: ["thinkphp"]
    cpe: ["cpe:2.3:a:thinkphp:thinkphp"]
