# providers.yaml —— IP/域名基础设施归属规则（供 core/attribution.py）。
#
# 两部分：
#   network_categories —— ASN org 关键字 → 网络类型（telecom/cloud/idc/cdn/security_proxy/...），供 layer2/3。
#   edge_providers     —— CDN/WAF/防红代理的 FingerprintHub 风格多信号指纹，供 layer4（score_edge_provider）。
#
# ★纪律（用户要求）：单一 ASN/CIDR/响应头**不足以 confirmed**（引擎要求 ≥2 个不同强信号 + 分数达阈值；
#   header 可被配置/删除/伪造）。名称落不实时聚成 unknown_cluster（后续 corpus slice）。此文件是**公开库风格
#   底库**（cloud/cdn/waf，可从 cdncheck/Awesome-WAF 扩充）；fxapk 自有的 verified/suspected 防红指纹应另放
#   providers/investigative/（后续 slice：需多文件加载器 + provenance/人工确认）。

network_categories:
  cloud:
    org_keywords:
      - tencent
      - qcloud
      - 腾讯
      - alibaba
      - aliyun
      - 阿里
      - 阿里云
      - huawei cloud
      - huaweicloud
      - 华为云
      - volcengine
      - 火山引擎
      - ucloud
      - 优刻得
      - amazon
      - aws
      - google cloud
      - microsoft azure
      - azure
      - baidu
      - 百度智能云
      - kingsoft cloud
      - 金山云
  cdn:
    # ★关键字要匹配 WHOIS/Shodan 里的**实际 org 形态**，不是商标连写名。实测 45.202.x 段的
    #   Shodan org 是 "Bunny Technology LLC"——只收 "bunnycdn" 时匹配不上，归属落 unknown，
    #   边缘 IP 被当成托管商查。
    # ★不要收通用英文裸词。实测 "Limelight Health"（医疗软件）、"Bunny Studio"、"Bunnyshell"
    #   都会被裸 limelight/bunny 判成 CDN，进而触发 PUBLIC_CDN 阻断把可能的真源站压掉。这类同名
    #   靠词边界挡不住（它们本就是独立词），只能写成足够专指的形态。
    org_keywords:
      - cloudflare
      - akamai
      - fastly
      - cloudfront
      - edgeone
      - stackpath
      - bunnycdn
      - bunny technology   # bunny.net 的登记主体（实测 Shodan org 形态）
      - bunnyway           # bunny.net 早期主体名
      - bunny.net
      - keycdn
      - cdn77
      - gcore               # 词边界生效，不会命中 Kingcore 一类粘连
      - g-core
      - edgio
      - limelight networks  # CDN 厂商全名；裸 limelight 会误伤同名的医疗/酒店公司
      - qrator
      - ddos-guard
  telecom:
    org_keywords:
      - chinanet
      - china telecom
      - 中国电信
      - chinatelecom
      - china unicom
      - 中国联通
      - cnc group
      - china mobile
      - 中国移动
      - cmcc
  idc:
    org_keywords:
      - idc
      - data center
      - datacenter
      - 机房
      - hosting
  security_proxy:
    org_keywords:
      - imperva
      - incapsula
      - sucuri
      - section.io  # leak-scan: allow 公开安全代理服务商规则，非案件 IOC
      - 加速乐
      - jiasule
      - yunaq
      - 知道创宇
      - yundun
      - 云盾

# edge_providers：多信号加权识别。role: reverse_proxy/cdn/waf/anti_blocking_fronting。
# signals 嵌套：dns.{cname_suffix,ns_suffix} / http.{headers,cookies,body_hashes,favicon.mmh3} /
#   tls.{spki_sha256,ja4s} / network.{asns,cidrs}。每条可带 weight（覆盖默认）。
edge_providers:
  - id: cdn.cloudflare
    name: Cloudflare
    category: cdn
    role: reverse_proxy
    signals:
      http:
        headers:
          - {name: cf-ray, weight: 6}         # 官方定义的请求标识
          - {name: server, regex: "^cloudflare$", weight: 5}
      dns:
        cname_suffix:
          - {value: ".cdn.cloudflare.net", weight: 8}
      network:
        asns:
          - {value: 13335, weight: 2}
    provenance: {source: public_docs, note: "CF-Ray 为官方标识；单头不判 confirmed"}

  - id: cdn.tencent_edgeone
    name: 腾讯 EdgeOne
    category: cdn
    role: reverse_proxy
    signals:
      http:
        headers:
          # 源站未提供 Server 时 EdgeOne 可能补 Server: TencentEdgeOne（可被源站配置改/删 → 需配合其它强信号）。
          - {name: server, regex: "^tencentedgeone$", weight: 6}
          - {name: eo-cache-status, regex: "^(hit|miss|refreshhit)$", weight: 4}
          - {name: eo-log-uuid, regex: ".+", weight: 4}
      dns:
        cname_suffix:
          - {value: ".eo.dnse.com", weight: 8}
    provenance:
      source: public_docs
      url: https://cloud.tencent.com/document/product/1552/87655  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：cloud.tencent.com
      note: "默认响应头可配置；Server 可能透传源站。多个 HTTP 头仍是同一信号面"

  - id: cdn.tencent
    name: 腾讯云 CDN
    category: cdn
    role: reverse_proxy
    signals:
      dns:
        cname_suffix:
          - {value: ".cdn.dnsv1.com", weight: 8}
          - {value: ".dsa.dnsv1.com", weight: 8}
      http:
        headers:
          - {name: x-nws-log-uuid, regex: ".+", weight: 5}
    provenance:
      source: public_docs
      urls:
        - https://intl.cloud.tencent.com/zh/document/product/228/5734  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：intl.cloud.tencent.com
        - https://intl.cloud.tencent.com/ind/document/product/228/42177  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：intl.cloud.tencent.com
      note: "X-Cache-Lookup 非独占；只用专用 CNAME 和请求追踪头"

  - id: cdn.huawei
    name: 华为云 CDN
    category: cdn
    role: reverse_proxy
    signals:
      dns:
        cname_suffix:
          - {value: ".c.cdnhwc1.com", weight: 8}
      http:
        headers:
          - {name: x-hcs-proxy-type, regex: "^[01]$", weight: 5}
    provenance:
      source: public_docs
      urls:
        - https://support.huaweicloud.com/cdn_faq/cdn_faq_0111.html  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：support.huaweicloud.com
        - https://support.huaweicloud.com/cdn_faq/cdn_faq_0245.html  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：support.huaweicloud.com

  - id: cdn.volcengine
    name: 火山引擎 CDN
    category: cdn
    role: reverse_proxy
    signals:
      http:
        headers:
          - {name: x-bdcdn-logid, regex: ".+", weight: 4}
          - {name: x-bdcdn-cache-status, regex: ".+", weight: 4}
    provenance:
      source: public_docs
      url: https://www.volcengine.com/docs/6454/1319866  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：www.volcengine.com
      note: "官方保留 CDN 响应头；不将整个 volces.com 或通用字节链路头当作 CDN"  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：volces.com

  - id: cdn.baidu_bos
    name: 百度智能云 BOS CDN
    category: cdn
    role: reverse_proxy
    signals:
      dns:
        cname_suffix:
          - {value: ".cdn.bcebos.com", weight: 8}
    provenance:
      source: public_docs
      url: https://cloud.baidu.com/doc/BOS/s/ckaqihkra-en  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：cloud.baidu.com
      note: "仅覆盖 BOS CDN 加速地址，不覆盖所有百度 CDN；普通 bcebos.com 是存储域名"  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：bcebos.com

  - id: cdn.qiniu
    name: 七牛云 CDN
    category: cdn
    role: reverse_proxy
    signals:
      dns:
        cname_suffix:
          - {value: ".qiniudns.com", weight: 8}
    provenance:
      source: public_docs
      url: https://developer.qiniu.com/fusion/13363/fusion-api-domain-management  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：developer.qiniu.com

  - id: cdn.upyun
    name: 又拍云 CDN
    category: cdn
    role: reverse_proxy
    signals:
      dns:
        cname_suffix:
          - {value: ".b0.aicdn.com", weight: 8}
    provenance:
      source: public_docs
      url: https://help.upyun.com/knowledge-base/cdn-quick-start/  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：help.upyun.com
      note: "只覆盖官方静态加速示例后缀；不泛化到直播推流等其他 aicdn.com 地址"  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：aicdn.com

  - id: cdn.kingsoft
    name: 金山云 CDN
    category: cdn
    role: reverse_proxy
    signals:
      dns:
        cname_suffix:
          - {value: ".ksyuncdn.com", weight: 8}
    provenance:
      source: public_docs
      url: https://docs.ksyun.com/documents/41418  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：docs.ksyun.com

  - id: waf.huawei
    name: 华为云 WAF
    category: security_proxy
    role: waf
    signals:
      dns:
        cname_suffix:
          - {value: ".vip1.huaweicloudwaf.com", weight: 8}
    provenance:
      source: public_docs
      url: https://support.huaweicloud.com/eu/api-waf/CreateHost.html  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：support.huaweicloud.com
      note: "仅覆盖官方示例后缀；接入域名不证明防护已启用或未旁路"

  - id: waf.tencent
    name: 腾讯云 WAF
    category: security_proxy
    role: waf
    signals:
      dns:
        cname_suffix:
          - {value: ".qcloudwzgj.com", weight: 8}
    provenance:
      source: public_docs
      url: https://cloud.tencent.com/document/product/627/43213  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：cloud.tencent.com
      note: "官方多个接入后缀中的一个；不按 qcloud 任意通配，不证明防护状态"

  - id: cdn.aliyun
    name: 阿里云 CDN/DCDN
    category: cdn
    role: reverse_proxy
    signals:
      http:
        headers:
          # X-Cache / X-Swift-CacheTime 为阿里云 CDN 常见缓存字段——但 X-Cache 非独占（多家 CDN 共用），
          # 故仅给中等权重、且靠 x_cache_only 负证据兜底防误判。
          - {name: x-swift-cachetime, weight: 5}
          - {name: eagleid, weight: 5}
      dns:
        # ★须为可注册后缀（引擎按标签边界匹配，'.kunlun' 这类半标签匹配不到 alikunlun.com）。
        cname_suffix:
          - {value: ".alikunlun.com", weight: 8}
          - {value: ".kunlunca.com", weight: 8}
          - {value: ".kunlunar.com", weight: 8}
          - {value: ".kunlunaq.com", weight: 8}
          - {value: ".kunlungr.com", weight: 8}
    provenance: {source: public_docs}

  - id: cdn.aliyun_esa
    name: 阿里云 ESA
    category: cdn
    role: reverse_proxy
    signals:
      http:
        headers:
          - {name: server, regex: "^esa$", weight: 4}
          - {name: eagleid, weight: 3}
          - {name: via, regex: "(^|[, ])ens-cache[0-9]+[.]", weight: 2}
    # 同一次响应的多个头属于同一信号面，最多 probable，不证明客户身份或源站。
    provenance:
      source: public_docs
      url: https://help.aliyun.com/zh/edge-security-acceleration/esa/support/troubleshooting-guide-for-unable-to-access-the-esa-website-after-login/  # leak-scan: allow 产品指纹的公开来源或厂商边界说明，非案件值：help.aliyun.com
      note: "EagleId 是官方请求追踪字段；Server/Via 为辅助指纹，需官方节点查询或独立证据核验"

  - id: waf.jiasule
    name: 加速乐（知道创宇）
    category: security_proxy
    role: waf
    signals:
      http:
        headers:
          - {name: server, regex: "jsl|jiasule", weight: 6}
        cookies:
          - {value: "__jsluid", weight: 5}
          - {value: "jsluid", weight: 5}
    provenance: {source: awesome_waf}

# 负证据全局生效（无需 provider 配置）：引擎对最佳候选自动评估 public_cloud_only / x_cache_only / nginx_only
# 三类公共基础设施特征并扣分（见 core/attribution._negative_adjustment）；可选 negative_weights 顶层块覆盖默认权重。
scoring:
  confirmed: 10
  probable: 6
  possible: 3
