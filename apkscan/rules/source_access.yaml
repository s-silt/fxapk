  access_tiers:
  - tier: free_no_registration
    evidence_status: confirmed
    registration_required: false
    api_access: public_resolver_no_authentication
    quota_value: null
  api_access_caveat: Cloudflare public DoH requires no authentication. DNS JSON has no standardized schema; prefer
    DNS wire format for critical parsers. DNS answers depend on resolver, query time and geography.
  capabilities:
