schema_version: fxapk-provider-research/1.0
verified_on: '2026-10-02'
methodology:
  quota_policy: Only official numeric claims are populated; no account entitlements or live service health verified.
  free_policy: Free means price/access category, not legal applicability to institutional, government or commercial
    forensic use.
  attribution_policy: Never merge resource holder, BGP origin network, hosting provider, edge/CDN provider and service
    operator. ASN names, shared IPs, ICP or certificates alone cannot establish service operator.
  independence_policy: Variants and products in the same source family are not independent corroboration.
  runtime_scope: This catalog grants no permission to query case indicators, upload APKs, publish URLs, request
    on-demand scans, buy credits, or create API keys.
  default_for_unknown: Treat undocumented entitlement/license status as unknown; never infer allowed from a configured
    credential or adapter.
  observational_limits: Retain retrieved_at separately from observed_at. Empty search or no_record is not exculpatory
    evidence. BGP, CDN, hosting, shared-IP and CT relationships change over time.
sources:
- provider_key: rdap
  name: Domain RDAP
  access_tiers:
  - tier: free_no_registration
    evidence_status: confirmed
    registration_required: false
    api_access: public_registration_query
    quota_value: null
  api_access_caveat: Use the IANA bootstrap registry and authoritative RDAP referral; not every ccTLD has the same
    deployment or access policy. Public registrant data may be redacted.
  capabilities:
  - domain_registration
  - registrar
  - registration_events
  - nameservers
  - registration_entity_if_public
  usage_terms_caveat: Public registration data is not proof of the present service operator; follow each registry
    terms, redaction and rate limits.
  official_urls:
  - https://www.icann.org/rdap/ # leak-scan: allow ICANN 官方 RDAP 说明，供目录权限与注册信息能力核验
  - https://www.rfc-editor.org/rfc/rfc9537.html # leak-scan: allow RFC 9537 官方规范，说明登记信息的隐藏与删减
  - https://www.iana.org/assignments/rdap-dns/rdap-dns.xhtml
  verified_on: '2026-10-02'
  quota_value: null
  account_live_health: not_checked
  source_family: registration
  evidence_roles:
  - domain_registration
  institutional_use_status: review_registry_terms
