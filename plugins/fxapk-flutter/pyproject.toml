[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxapk-flutter"
version = "0.2.0"
description = "Offline Flutter AOT analysis and evidence indexing for fxapk"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fxapk>=2.0.0", "typer", "pyelftools==0.32"]

[project.entry-points."fxapk.plugins"]
flutter = "fxapk_flutter.plugin:plugin_factory"

[tool.setuptools.packages.find]
where = ["src"]
