[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxapk-android-ui"
version = "0.2.0"
description = "Optional Android CLI UI observation plugin for fxapk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fxapk>=2.0.0", "typer"]

[project.entry-points."fxapk.plugins"]
android_ui = "fxapk_android_ui.plugin:plugin_factory"

[tool.setuptools.packages.find]
where = ["src"]
