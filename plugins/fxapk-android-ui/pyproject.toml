[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxapk-android-ui"
version = "0.1.0"
description = "Optional Android CLI UI observation plugin for fxapk"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["fxapk>=1.18.0", "typer"]

[project.entry-points."fxapk.plugins"]
android_ui = "fxapk_android_ui.plugin:plugin_factory"

[tool.setuptools.packages.find]
where = ["src"]
