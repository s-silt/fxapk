# 本地防御性云 / SaaS 凭据配置注册表（Stage 1：静态上下文键名 + 显式厂商元数据）。
#
# 约束：
# 1. 仅按精确厂商前缀上下文配置键名匹配，禁止搜索通用键名（如 api_key/secret/token/password）。
# 2. 禁止仅凭高熵字符串判定凭据；不使用厂商域名或模糊标记。
# 3. 命中结果仅返回固定脱敏标记，禁止返回或记录原始值及其前缀/长度。
# 4. 仅作本地静态取证初筛，不代表已验证厂商身份或凭据有效性（verification_status=unverified）。

schema_version: 1
verification_status: unverified
where_to_request: 无直接调证对象（静态候选云/SaaS凭据配置，需结合主体核实归属后依法调证）
evidence_to_obtain:
  - 结合应用包内显式云服务配置，由有权机关依法核实云服务归属主体
  - 经法定程序向对应云厂商调取涉案配置关联的服务访问日志

providers:
  - provider_id: aliyun
    label: Aliyun Cloud Credential
    service_category: cloud_iaas
    verification_status: unverified
    config_keys:
      - aliyun_access_key_secret
      - aliyun_oss_access_key_secret
      - alicloud_secret_key

  - provider_id: tencent_cloud
    label: Tencent Cloud Credential
    service_category: cloud_iaas
    verification_status: unverified
    config_keys:
      - tencent_secret_key
      - tencent_cloud_secret_key
      - qcloud_secret_key

  - provider_id: huawei_cloud
    label: Huawei Cloud Credential
    service_category: cloud_iaas
    verification_status: unverified
    config_keys:
      - huawei_secret_access_key
      - huaweicloud_sdk_sk
      - huaweicloud_secret_key

  - provider_id: qiniu
    label: Qiniu Storage Credential
    service_category: cloud_storage
    verification_status: unverified
    config_keys:
      - qiniu_secret_key
      - qiniu_kodo_secret_key

  - provider_id: upyun
    label: UPYUN Storage Credential
    service_category: cloud_storage
    verification_status: unverified
    config_keys:
      - upyun_operator_password
      - upyun_secret_key

  - provider_id: rongcloud
    label: RongCloud IM Credential
    service_category: im_saas
    verification_status: unverified
    config_keys:
      - rongcloud_app_secret
      - rong_cloud_app_secret

  - provider_id: agora
    label: Agora RTC Credential
    service_category: rtc_saas
    verification_status: unverified
    config_keys:
      - agora_app_certificate
      - agora_customer_secret
